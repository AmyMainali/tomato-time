<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tomato time</title>
<meta name="description" content="A whimsical, hand-drawn pomodoro timer with to-dos and daily stats.">
<meta name="theme-color" content="#fffefc">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="focus">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 44 44"><path d="M22 4l5.2 11.6 12.6 1.4-9.4 8.6 2.7 12.4L22 31.4 10.9 38l2.7-12.4-9.4-8.6 12.6-1.4z"/></symbol>
  <symbol id="spark" viewBox="0 0 44 44"><path d="M22 3c1.5 11 5 16 19 19-14 3-17.500 8-19 19-1.500-11-5-16-19-19 14-3 17.500-8 19-19z"/></symbol>
  <symbol id="heart" viewBox="0 0 44 44"><path d="M22 38C8 28 5 20 8 14c3-6 11-5 14 1 3-6 11-7 14-1 3 6 0 14-14 24z"/></symbol>
  <symbol id="flower" viewBox="0 0 44 44"><path d="M22 5c6 0 7 8 4 11 7-3 13 3 9 8-2 3-6 3-9 2 5 5 1 12-4 12s-9-7-4-12c-3 1-7 1-9-2-4-5 2-11 9-8-3-3-2-11 4-11z"/><circle cx="22" cy="22" r="3.500"/></symbol>
  <symbol id="swirl" viewBox="0 0 44 44"><path d="M22 22c0-3 4-3 4 0s-6 5-9 1-1-12 6-12 13 8 10 16-12 11-19 6"/></symbol>
  <symbol id="clover" viewBox="0 0 44 44"><path d="M22 22c-8-2-12-9-8-13s9-1 8 6c1-7 7-10 11-6s0 11-8 13c7 2 9 8 5 11s-8-1-8-8c0 7-6 11-10 8s0-9 10-11z"/></symbol>
</svg>

<div class="doodles" aria-hidden="true">
  <svg style="left:4%;top:9%;color:var(--sun)" class="tw"><use href="#star"/></svg>
  <svg style="left:87%;top:6%;color:var(--pink)" class="tw"><use href="#flower"/></svg>
  <svg style="left:92%;top:38%;color:var(--sky)"><use href="#spark"/></svg>
  <svg style="left:2%;top:46%;color:var(--mint)"><use href="#clover"/></svg>
  <svg style="left:7%;top:80%;color:var(--pink)" class="tw"><use href="#heart"/></svg>
  <svg style="left:90%;top:84%;color:var(--sun)"><use href="#star"/></svg>
  <svg style="left:48%;top:92%;color:var(--lav)" class="sw"><use href="#swirl"/></svg>
  <svg style="left:60%;top:2%;color:var(--mint)" class="sw"><use href="#swirl"/></svg>
  <svg style="left:24%;top:3%;color:var(--sky)" class="tw"><use href="#spark"/></svg>
  <svg style="left:75%;top:64%;color:var(--lav)"><use href="#flower"/></svg>
</div>

<div class="wrap" id="app">
  <header>
    <div>
      <h1><svg class="logo" viewBox="0 0 56 56" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 30C9 18 19 14 28 17C37 14 47 19 46 31C45 43 36 51 28 50C19 51 11 43 10 30Z" fill="#ffb3a8" stroke="#ef7b6b"/><path d="M12 32C12 21 20 17 28 20C37 17 45 22 44 33C43 44 36 52 28 52" stroke="#ef7b6b" opacity=".4" transform="translate(1.5 1)"/><path d="M16 27C17 23 19 21 22 20" stroke="#fff" stroke-width="2.6" opacity=".85"/><path d="M28 17C24 11 17 11 14 14C18 18 24 19 28 17Z" fill="#a8e3b9" stroke="#5fb67f"/><path d="M28 17C32 10 39 10 42 13C38 18 32 19 28 17Z" fill="#a8e3b9" stroke="#5fb67f"/><path d="M28 17C28 12 29 9 31 6" stroke="#5fb67f"/></svg>tomato time</h1>
      <p id="tagline">little bursts of focus, with snack breaks</p>
    </div>
    <button class="btn small" id="openSettings" aria-label="Open settings">settings</button>
  </header>

  <div class="layout">
    <section class="card timer" aria-label="Timer">
      <div class="modes" role="group" aria-label="Timer mode">
        <button class="chip" data-mode="focus" aria-pressed="true">focus</button>
        <button class="chip" data-mode="short" aria-pressed="false">short break</button>
        <button class="chip" data-mode="long" aria-pressed="false">long break</button>
      </div>
      <div class="dial">
        <svg class="ring" viewBox="0 0 300 300" aria-hidden="true">
          <path class="track" id="pTrack"/>
          <path class="prog" id="prog" pathLength="1"/>
          <path class="outline" id="pO1"/>
          <path class="outline" id="pO2"/>
        </svg>
        <div class="center">
          <div class="status" id="status">ready to focus</div>
          <div class="time" id="time" role="timer" aria-live="off">25:00</div>
          <div class="label" id="label">just focusing</div>
        </div>
      </div>
      <div class="ctrls">
        <button class="btn main" id="start" title="Start or pause (Space)">▶ start</button>
      </div>
      <div class="ctrls">
        <button class="btn small" id="reset" title="Start this timer over (R)">↺ restart</button>
        <button class="btn small" id="skip" title="Jump to the next timer (S)">skip ⏭</button>
      </div>
      <div class="stars" id="stars" aria-label="Sessions until long break"></div>
      <div class="hint" id="hint"></div>
    </section>


    <div class="side">
      <section class="card" aria-label="Tasks">
        <h2>today’s to-dos</h2>
        <form class="add" id="addForm" onsubmit="return false">
          <label class="field"><span class="sr">New task</span><input id="newTask" placeholder="what are we working on?" maxlength="80" autocomplete="off"></label>
          <button class="btn small" id="addBtn" type="submit">add</button>
        </form>
        <ul class="tasks" id="tasks"></ul>
      </section>
      <section class="card" aria-label="Today’s stats">
        <h2>today so far</h2>
        <div class="stats">
          <div><b id="sPomos">0</b><span>tomatoes</span></div>
          <div><b id="sMins">0</b><span>minutes</span></div>
          <div><b id="sTotal">0</b><span>all time</span></div>
        </div>
        <div style="text-align:center;margin-top:12px"><button class="btn small" id="clearStats">clear today</button></div>
      </section>
    </div>
  </div>

</div>

<dialog id="dlg" aria-label="Settings">
  <div class="card">
    <h2>settings</h2>
    <div class="row"><label for="o-focus">focus (minutes)</label><input type="number" id="o-focus" min="1" max="120"></div>
    <div class="row"><label for="o-short">short break (minutes)</label><input type="number" id="o-short" min="1" max="60"></div>
    <div class="row"><label for="o-long">long break (minutes)</label><input type="number" id="o-long" min="1" max="90"></div>
    <div class="row"><label for="o-every">long break after (tomatoes)</label><input type="number" id="o-every" min="2" max="10"></div>
    <div class="row"><label for="o-auto">start next session automatically</label><input type="checkbox" id="o-auto"></div>
    <div class="row"><label for="o-sound">play a chime</label><input type="checkbox" id="o-sound"></div>
    <div class="row"><label for="o-notify">desktop notification</label><input type="checkbox" id="o-notify"></div>
    <div style="text-align:right;margin-top:14px"><button class="btn small" id="closeDlg">done</button></div>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="js/app.js"></script>
</body>
</html>
